# Running example of part2/theory_core.tex (Section sec:tasks): a four-step supplier-invoice chain.
#
# Single source of truth. Every input names where its value comes from:
#   default:<section>.<key>              engine/src/autofrontier/defaults.yaml, with the data agent's params.yaml
#                                        (or params_reliability.yaml) value where the default links one, resolved by
#                                        the engine's own loader (autofrontier.config.load_params)
#   range_low:<key> / range_high:<key>   an end of that default's [low, high] range
#   params:<dotted path>[|<pick>]        data/tasks/params.yaml directly
#   prior:<file>:<row id>:<column>       engine/src/autofrontier/priors/<file>.csv (the engine's activity priors)
#   csv:<file>:<key column>=<id>:<col>   data/tasks/<file>.csv
#   setting                              an example setting with no default (the example's choice; stated in `basis`)
# code/examples/invoice_chain.py resolves these, computes every number the text quotes and writes
# data/examples/invoice_chain.json and part2/tables/invoice_macros.tex. code/verify_part2_core.py reads this file,
# recomputes independently and checks both outputs. Do not type example numbers into the .tex files.
#
# Model: the core model of Section sec:tasks with review detection (prop:tasks-review), which is the engine with its
# failure taxonomy switched off (reliability.enabled = false). Engine features outside the core model are listed
# under `not_modeled` and are not part of the example.

meta:
  name: invoice_chain
  version: '2026-10-29c'   # conditional case capped at min(r_bar_high, q*) (P2 theory pass v2)
  model: 'core model of theory_core.tex; engine configuration reliability.enabled = false'
  not_modeled:
    - 'tax wedges and effective wages (the engine choice-cost view); the example uses pre-tax cash costs'
    - 'calendar dynamics (inference price decline, capability growth); the example is static at the capability date t0, and the build-cost decline delta_F enters only the rebuilds of the engine-horizon program'
    - 'the failure taxonomy in mode choice (hallucination, complacency, autonomy); Section sec:tasks-failure examples apply it to the approval step separately'
    - 'control costs of the failure taxonomy (monitoring, least privilege, kill switch) and the ICFR control-cost change (accounting theorist)'
    - 'the success-logit penalties that require the failure taxonomy (a_fm) and the pipeline driver (a_J)'

firm:
  volume: {value: 120000, source: setting, basis: 'supplier invoices a year; at the P02 procure-to-pay prior of 100 invoices per $1M of revenue (data/tasks/processes.csv, assumed) this is a firm with $1.2 billion of revenue'}
  invoices_per_musd_revenue: {source: 'csv:processes:process_id=P02:typical_volume_per_musd_revenue'}
  function: {value: finance_accounting, source: setting, basis: 'accounts payable sits in finance and accounting (engine function prior finance_accounting; params outsourcing key F11)'}
  occupation_soc: {value: '43-3031', source: setting, basis: 'Bookkeeping, Accounting, and Auditing Clerks'}
  wage_annual: {source: 'csv:occupations:soc=43-3031:wage_median', basis: 'OEWS May 2025 median'}
  tau_L: {source: 'default:labor.tau_L'}
  hours_per_fte: {source: 'default:labor.hours_per_fte'}
  exposure: {value: 0.5, source: setting, basis: 'engine fallback LLM exposure when no activity data (impute.py) and the reference exposure of augment.exposure_ref'}
  data_class: {value: internal, source: setting, basis: 'engine fallback for a function without personal data (impute.py); finance_accounting personal_data = 0'}
  write_access: {value: 1.0, source: setting, basis: 'engine fallback (agents can write)'}
  external_inputs: {value: 0.15, source: setting, basis: 'engine fallback for a function that is not customer facing'}
  high_reliability: {source: 'prior:function_attributes:finance_accounting:high_reliability'}
  rho_O: {source: 'params:outsourcing.price_ratio_pO_over_wt|F11 finance and accounting'}
  n_systems: {source: 'default:readiness.default_n_systems'}
  iota_prior: {source: 'prior:function_attributes:finance_accounting:iota_prior', basis: 'engine prior of today''s readiness in finance (reported, not used as case a)'}
  iota_low: {value: 0.4, source: setting, basis: 'case (a), a low-readiness firm (coordinator decision, 29 Oct)'}
  iota_high: {source: 'default:readiness.targets', pick: max, basis: 'highest readiness target of the engine'}
  capability_date: {source: 'default:capability.t0', basis: 'the example is static at the date of the horizon fit'}

steps:
  - {id: capture, name: 'Invoice capture', t_hours: {value: 0.05, source: setting}, gwa: {value: '4.A.3.b.6', source: setting, basis: 'O*NET GWA Documenting/Recording Information'}, regulated: {value: true, source: setting, basis: 'accounts payable is a financial-reporting process in scope for SOX ICFR at a public company; regulated status is a property of the process and its data class, not of the firm''s error tolerance, so it holds in the conditional case with the relaxed target (coordinator decision of 29 Oct; replaces the engine rule regulated iff target >= 0.99)'}}
  - {id: match, name: 'Matching to order and receipt', t_hours: {value: 0.08, source: setting}, gwa: {value: '4.A.2.a.2', source: setting, basis: 'O*NET GWA Processing Information (reconcile records); P02 step 5 uses DWA 4.A.2.a.2.d.1'}, regulated: {value: true, source: setting, basis: 'accounts payable is a financial-reporting process in scope for SOX ICFR at a public company; regulated status is a property of the process and its data class, not of the firm''s error tolerance, so it holds in the conditional case with the relaxed target (coordinator decision of 29 Oct; replaces the engine rule regulated iff target >= 0.99)'}}
  - {id: exceptions, name: 'Exception handling', t_hours: {value: 0.12, source: setting}, gwa: {value: '4.A.2.b.1', source: setting, basis: 'O*NET GWA Making Decisions and Solving Problems'}, regulated: {value: true, source: setting, basis: 'resolving three-way-match exceptions changes recorded liabilities, so it is a key ICFR activity in accounts payable; regulated status is a property of the process, not of the target (coordinator decision of 29 Oct)'}}
  - {id: approval, name: 'Approval', t_hours: {value: 0.05, source: setting}, gwa: {value: '4.A.2.a.3', source: setting, basis: 'O*NET GWA Evaluating Information to Determine Compliance with Standards'}, regulated: {value: true, source: setting, basis: 'accounts payable is a financial-reporting process in scope for SOX ICFR at a public company; regulated status is a property of the process and its data class, not of the firm''s error tolerance, so it holds in the conditional case with the relaxed target (coordinator decision of 29 Oct; replaces the engine rule regulated iff target >= 0.99)'}}
# Per-step attributes derived by the engine's rules from the GWA (impute.py): r_bar, L_mult, iota_star, separable,
# eliminable from priors/activity_attributes.csv; for a high-reliability function and a GWA in HIGH_REL_GWAS,
# r_bar = max(r_bar, review.r_bar_high) and L_mult = max(L_mult, review.L_mult_regulated); task type from
# augment.decision_gwas / creation_gwas; work through a user interface for capability.computer_use_gwas.
high_rel_gwas: {value: ['4.A.2.a.2', '4.A.2.a.3', '4.A.3.b.6', '4.A.2.a.4'], source: setting, basis: 'copy of engine impute.py HIGH_REL_GWAS'}

