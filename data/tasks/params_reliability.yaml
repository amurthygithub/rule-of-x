# Reliability parameters: AI errors, hallucination, agentic misbehavior, review, common-mode failure (spec 23).
# Written by the reliability-evidence agent, 29 Oct 2026. Sources, URLs and what each measures:
# notes/data_sources_reliability.md. BibTeX: part2/refs_reliability.bib (new keys) and the reused keys listed there.
#
# Leaf convention (same as params.yaml): value = default; range = [low, high]; quality = source-quality flag
# (vocabulary of code/data_part2/08_params.py); source; unit; note; assumed; plus
#   grounding: a sourced | b grounded by precedent (analogy stated, range widened) | c calibrated from our own data |
#              d free scenario parameter (report only as a scenario dimension, never as a baseline point estimate)
#   analogy:   the precedent, when grounding is b
#   vintage:   models and dates the measurement refers to (rates change quickly; read every number with its vintage)
# Most sources are controlled evaluations or benchmarks, not field incident rates. Where a block is a field rate it says so.
#
# Engine links (engine/src/autofrontier/defaults.yaml, link key params_rel; config.py applies value and range):
#   reliability.h_retrieval -> hallucination.retrieval_grounded_rate
#   reliability.h_open      -> hallucination.open_ended_rate
#   reliability.d_e         -> review.catch_rate_ordinary
#   reliability.d_h         -> review.catch_rate_hallucination
#   reliability.b_ab        -> automation_bias.catch_rate_decline
#   reliability.m0          -> agentic.misbehavior_rate_per_task
#   reliability.alpha_tail  -> agentic.loss_tail_index
#   reliability.nu_cm       -> common_mode.provider_incidents_per_year
#   review.r_bar_high       -> human_baseline.reliability_target_high_stakes    (params commit 29 Oct 2026)
#   review.q_M              -> human_baseline.manual_step_pass_rate             (params commit 29 Oct 2026)
#   augment.e_H             -> human_baseline.in_house_error_rate               (params commit 29 Oct 2026)
# Blocks marked "suggested engine key" are not yet linked.

meta:
  version: '1.0'
  built: '2026-10-29'
  built_by: reliability-evidence agent (hand-written from verified sources; no script)
  source_log: notes/data_sources_reliability.md
  bib: part2/refs_reliability.bib
  activity_classes:
    retrieval_grounded: output must be supported by supplied or retrieved documents (summaries, notes, RAG answers, extraction)
    open_generation: output drawn from model knowledge without a supplied source (drafting, fact recall, citations, advice)
    code: software changes judged by tests and by review
    transactions_tool_use: multi-step tool use that changes external state (orders, refunds, bookings, email, payments)

# ---------------------------------------------------------------------------------------------------- hallucination
hallucination:
  retrieval_grounded_rate:
    value: 0.05
    range:
    - 0.015
    - 0.2
    unit: share of output units (one summary, note or answer) containing at least one unsupported or fabricated statement
    quality: peer_reviewed
    grounding: a
    source: 'Vectara hallucination leaderboard (GitHub, updated 11 May 2026; practitioner, vendor classifier HHEM-2.3):
      frontier models 3.1-15.1% of summaries (GPT-5.4 7.0%, Gemini 2.5 Pro 7.0%, Claude Opus 4.6 12.2%), all models 1.8-24.2%;
      Asgari et al. (2025) npj Digital Medicine: GPT-4 clinical notes, 1.47% of 12,999 sentences hallucinated (44% of them
      major, medRxiv version), about 29 sentences per note; OpenAI (2025) GPT-5 announcement and deployment-safety chart:
      on production-representative prompts with browsing, 4.8% (gpt-5-thinking) to 22.0% (o3) of responses had at least
      one major factual error; Magesh et al. (2025) JELS: legal RAG tools 17-33% of responses hallucinated'
    vintage: GPT-4 (2023-24) to GPT-5.x, Claude 4.x, Gemini 2.5-3.1 (2025-26)
    note: 'Central = middle of frontier per-response rates on summarization and browsing (3-12%). Per sentence or claim the
      rate is lower (1.5-5%); per response it is higher because responses contain many claims (1.47% per sentence implies
      about 35% of 29-sentence notes with one or more if errors were independent; they are not, so treat as an upper bound).
      Hard legal research reaches 0.17-0.33 (by_domain). The previous engine default 0.01 matches per-sentence rates,
      not per-unit rates.'
    assumed: false
    by_unit:
      per_sentence_or_claim:
        value: 0.03
        range:
        - 0.015
        - 0.13
        quality: peer_reviewed
        grounding: a
        source: 'Asgari et al. (2025): 1.47% of sentences; OpenAI GPT-5 chart (browsing, production-like prompts): 4.5%
          (gpt-5-thinking) to 12.9% (GPT-4o) of claims incorrect; vendor data for the second'
        assumed: false
      per_response:
        value: 0.07
        range:
        - 0.03
        - 0.22
        quality: company_statement
        grounding: a
        source: 'OpenAI GPT-5 chart: 4.8% (gpt-5-thinking), 11.6% (gpt-5-main), 20.6% (GPT-4o), 22.0% (o3) of responses
          with at least one major factual error; mapping of chart labels confirmed by the stated ratios ("~45% less likely
          than GPT-4o", "~80% less likely than o3"). Vectara frontier models 3-15% of summaries'
        note: vendor self-report on its own traffic; not independently audited
        assumed: false
    by_domain:
      legal_research_rag:
        value: 0.25
        range:
        - 0.17
        - 0.34
        quality: peer_reviewed
        grounding: a
        source: 'Magesh, Surani, Dahl, Suzgun, Manning and Ho (2025), JELS 22(2) 216-242: 202 preregistered queries;
          Lexis+ AI accurate 65%, incomplete 18%, hallucinated about 17%; Westlaw AI-Assisted Research accurate 41%,
          hallucinated about 33-34%; Ask Practical Law AI accurate 19%, incomplete 62%, about 19% hallucinated'
        note: hallucinated = incorrect or misgrounded (citation does not support the claim). Queries include false-premise
          and jurisdiction-specific items, so harder than routine use.
        vintage: tools as of spring 2024
        assumed: false
      clinical_note_from_transcript:
        value: 0.0147
        range:
        - 0.0147
        - 0.0147
        unit: share of note sentences
        quality: peer_reviewed
        grounding: a
        source: 'Asgari et al. (2025) npj Digital Medicine, doi:10.1038/s41746-025-01670-7: 191 of 12,999 sentences (1.47%);
          omissions 1,712 of 49,590 transcript sentences (3.45%); 84 of 191 hallucinations major (44%) and 286 of 1,712
          omissions major (16.7%) in the medRxiv version'
        vintage: GPT-4-32k-0613, 18 prompt and workflow configurations, 450 PriMock transcripts
        assumed: false
      financial_qa_over_filings:
        value: 0.81
        range:
        - 0.81
        - 0.81
        unit: share of questions answered incorrectly or refused
        quality: working_paper
        grounding: a
        source: 'Islam et al. (2023), FinanceBench, arXiv:2311.11944: GPT-4-Turbo with a retrieval system incorrectly answered
          or refused 81% of 150 sampled questions on public-company filings'
        note: an upper bound on hallucination (includes refusals and retrieval failures); 2023 configuration; read as
          evidence that retrieval over long filings is a weak point, not as a current rate
        vintage: GPT-4-Turbo, Llama 2, Claude 2 (Nov 2023)
        assumed: false
  open_ended_rate:
    value: 0.15
    range:
    - 0.05
    - 0.5
    unit: share of output units containing at least one fabricated specific (fact, citation, case, figure)
    quality: peer_reviewed
    grounding: a
    source: 'OpenAI (2025) o3 and o4-mini system card: PersonQA hallucination rate 16% (o1), 33% (o3), 48% (o4-mini);
      SimpleQA 44% (o1), 51% (o3), 79% (o4-mini); Walters and Wilder (2023) Sci. Rep.: fabricated citations 55% (GPT-3.5),
      18% (GPT-4) of 636; Chelli et al. (2024) JMIR: 28.6% (GPT-4), 39.6% (GPT-3.5), 91.4% (Bard) of references; Min et
      al. (2023) EMNLP: ChatGPT FActScore 58% on biographies (42% of atomic facts unsupported); Dahl et al. (2024) JLA:
      58% (GPT-4) to 88% (Llama 2) on verifiable questions about federal cases'
    vintage: GPT-3.5, GPT-4 (2023-24); o1, o3, o4-mini (2025)
    note: 'Central 0.15 sits between production-like prompts (5-22% of responses with browsing, by_task) and specific-fact
      recall without retrieval (16-60%). Use the by_task values when the activity is known. The previous engine default
      0.05 holds only for frontier reasoning models on production-like prompts with browsing.'
    assumed: false
    by_task:
      specific_fact_recall_no_retrieval:
        value: 0.33
        range:
        - 0.16
        - 0.6
        quality: company_statement
        grounding: a
        source: 'PersonQA 16-48% (OpenAI system card 2025); Dahl et al. (2024) 58-88% (legal, 2023 models); FActScore 42%
          unsupported (2023)'
        assumed: false
      citation_generation_no_retrieval:
        value: 0.25
        range:
        - 0.18
        - 0.55
        quality: peer_reviewed
        grounding: a
        source: 'Walters and Wilder (2023): 18% (GPT-4), 55% (GPT-3.5) fabricated, plus substantive errors in 24% and 43%
          of the real ones; Chelli et al. (2024): 28.6% (GPT-4), 39.6% (GPT-3.5)'
        vintage: GPT-3.5, GPT-4 (2023)
        assumed: false
      production_prompts_with_browsing:
        value: 0.07
        range:
        - 0.048
        - 0.22
        quality: company_statement
        grounding: a
        source: OpenAI GPT-5 announcement and chart (Aug 2025), as hallucination.retrieval_grounded_rate.by_unit.per_response
        assumed: false
      adversarial_short_fact_benchmark:
        value: 0.51
        range:
        - 0.19
        - 0.91
        unit: share of questions answered incorrectly (not attempted excluded from the numerator)
        quality: working_paper
        grounding: a
        source: 'Wei et al. (2024) SimpleQA, arXiv:2411.04368: incorrect 19.3% (Claude-3-sonnet, 75% not attempted) to 90.5%
          (GPT-4o-mini); GPT-4o 60.8%, o1-preview 48.1%; o3 51% (system card)'
        note: questions were collected adversarially against GPT-4, so rates overstate everyday error; use only as an
          upper bound for long-tail facts. Models that abstain more show lower incorrect rates.
        assumed: false
  calibration_and_abstention:
    value: null
    quality: working_paper
    grounding: a
    source: 'Wei et al. (2024): correct-given-attempted 8.7-47.0% across models; Claude-3 models abstained on 35-75%; Kalai,
      Nachum, Vempala and Zhang (2025, arXiv:2509.04664): binary grading rewards guessing, so hallucination persists; for
      arbitrary facts the post-pretraining hallucination rate is at least the share of facts seen once in training (singleton
      rate)'
    note: theory supports a floor on h for long-tail facts that capability alone does not remove; supports h_floor_share
      > 0 in the engine (its value 0.1 remains scenario)
    assumed: false
  capability_monotonicity:
    value: not monotone
    quality: company_statement
    grounding: a
    source: 'OpenAI (2025) o3 system card: PersonQA hallucination 16% (o1) vs 33% (o3) vs 48% (o4-mini) although o3 is more
      capable; OpenAI (2025) GPT-5: about 80% fewer responses with a major error than o3. Lin et al. (2022) TruthfulQA: larger
      models were less truthful (best 58% vs humans 94%)'
    note: h does not fall reliably with capability within or across generations; model h as a function of model version
      and task, with a floor, not as a smooth function of capability
    assumed: false
  floor_share_h:
    value: 0.1
    range:
    - 0.05
    - 0.3
    quality: assumed
    grounding: d
    source: 'scenario; context: within one generation the best-to-worst ratio of hallucination rates is about 3-5x
      (GPT-4 18% vs GPT-3.5 55% fabricated citations; gpt-5-thinking 4.8% vs o3 22.0%), and Kalai et al. (2025) imply a
      positive floor for arbitrary facts'
    note: suggested engine key reliability.h_floor_share (unlinked)
    assumed: true

# ---------------------------------------------------------------------------------------------------- ordinary errors
ordinary_error:
  note: 'e_j is task-length dependent and is produced by the capability path in params.yaml (error_rate_epsilon_A: logistic
    in d / H50). The blocks below are the measured anchors by activity class; they are not separate engine defaults.'
  retrieval_grounded_omission_rate:
    value: 0.0345
    range:
    - 0.0345
    - 0.18
    unit: share of source sentences omitted (clinical) or share of responses incomplete (legal)
    quality: peer_reviewed
    grounding: a
    source: 'Asgari et al. (2025): 3.45% of transcript sentences omitted, 16.7% of omissions major; Magesh et al. (2025):
      incomplete responses 18% (Lexis+ AI) to 62% (Ask Practical Law AI)'
    assumed: false
  transactions_tool_use_task_failure:
    value: 0.5
    range:
    - 0.3
    - 0.85
    unit: share of multi-step tool-use tasks not completed correctly (single trial)
    quality: peer_reviewed
    grounding: a
    source: 'Yao et al. (2025) tau-bench, ICLR 2025: pass^1 retail 61.2% and airline 35.2% for gpt-4o (2024), 14.6-61.2%
      across 12 models; Xu et al. (2024) TheAgentCompany: best agent (Gemini 2.5 Pro) 30.3% of 175 tasks fully completed;
      Debenedetti et al. (2024) AgentDojo: benign utility 34.5-78.2%'
    vintage: 2024 to mid-2025 agents; the capability path moves this over time
    failure_mix_tau_bench_gpt4o_retail:
      wrong_argument_or_wrong_information: 0.55
      wrong_decision_on_domain_rules: 0.25
      partial_resolution_of_compound_request: 0.19
    assumed: false
  code_test_pass_vs_mergeable:
    value: 0.0
    range:
    - 0.0
    - 0.27
    unit: share of agent pull requests mergeable as-is, among those reviewed
    quality: practitioner_dataset_disclosed
    grounding: a
    source: 'METR (2025), Research update: algorithmic vs holistic evaluation (13 Aug 2025): Claude 3.7 Sonnet passed
      maintainers'' tests on 38% of 18 issues (27% of the 15 reviewed); none of the 15 reviewed PRs was mergeable as-is;
      fixing took about 42 min on average (26 min for test-passing PRs) vs about 1.3 h for the original maintainers'
    note: tests are a weak reviewer of code quality; test pass rates (SWE-bench style, Jimenez et al. 2024) overstate
      production-ready completion. Small sample (n = 15), research note, not peer reviewed.
    assumed: false
  code_security_vulnerability_share:
    value: 0.4
    range:
    - 0.28
    - 0.44
    unit: share of generated programs with a CWE vulnerability in security-relevant scenarios
    quality: peer_reviewed
    grounding: a
    source: 'Pearce et al. (2022), IEEE S&P 754-768: 1,689 Copilot programs in 89 CWE scenarios, about 40% vulnerable
      (28-44% by axis); Perry et al. (2023) CCS: 47 participants, AI-assisted users wrote secure code less often (encryption
      21% vs 43%; signing 3% vs 21%) and believed their code more secure'
    vintage: 'Copilot 2021; codex-davinci-002 (2022); old models, use only as a historical anchor'
    assumed: false

# ---------------------------------------------------------------------------------------------------- review
review:
  catch_rate_ordinary:
    value: 0.65
    range:
    - 0.45
    - 0.85
    unit: share of ordinary (non-adversarial, checkable) errors in a reviewed unit that the reviewer finds
    quality: peer_reviewed
    grounding: b
    analogy: human inspection of a work product seeded with errors (code inspection applied to spreadsheets)
    source: 'Panko (1999), Applying Code Inspection to Spreadsheet Testing, JMIS 16(2) 159-176: 60 inspectors found 63%
      of 8 seeded errors alone, 83% in groups of three (the group phase pooled errors already found); subjects were overconfident'
    note: 'Range widened below the individual rate for transfer and above it to the group rate. The previous engine default
      0.9 [0.7, 0.98] exceeds the group rate in the precedent. Theory example values (0.9-0.95) should be read as optimistic.'
    assumed: false
  catch_rate_hallucination:
    value: 0.4
    range:
    - 0.2
    - 0.6
    unit: share of confident, plausible AI errors (fabrications, wrong suggestions presented as correct) that a reviewer catches
    quality: peer_reviewed
    grounding: a
    source: 'Si et al. (2024), NAACL 1459-1474: 80 crowdworkers verifying claims; accuracy 0.35 when the LLM explanation
      was wrong, vs 0.49 with no evidence and 0.54 with retrieval on the same items, and 0.87 when it was right; Dratsch
      et al. (2023) Radiology 307(4): 27 radiologists, accuracy with incorrect AI BI-RADS suggestions 19.8% (inexperienced),
      24.8% (moderately), 45.5% (very experienced), vs about 80% with correct suggestions'
    note: 'd_h < d_e holds in the evidence (0.20-0.46 vs 0.63). Checking outputs against sources (citation lookup,
      document grounding) should raise d_h for retrieval-grounded work; no study measures by how much, so a retrieval-grounded
      d_h above 0.6 is scenario. Field failures of review on fabricated citations: Mata v. Avianca (2023), Deloitte report
      for DEWR (2025), about 712 court decisions on hallucinated content by Dec 2025.'
    assumed: false
  catch_rate_misbehavior_automated_monitor:
    value: 0.6
    range:
    - 0.42
    - 0.95
    unit: recall of an LLM monitor for specification gaming or reward hacking in agent transcripts
    quality: working_paper
    grounding: a
    source: 'Zhong, Raghunathan and Carlini (2025), ImpossibleBench, arXiv:2510.20270: monitors detected 86-89% of cheating
      on Impossible-LiveCodeBench and 42-65% on Impossible-SWEbench; Baker et al. (2025, arXiv:2503.11926): action-only
      monitor recall 60%, chain-of-thought monitor 95% (precision 81% and 77%) on systemic hacks by o3-mini; METR (2025):
      its two detection methods each missed cases the other caught'
    note: suggested engine key reliability.d_m_monitor; CoT monitoring degrades if optimization pressure is applied to the
      chain of thought (Baker et al.)
    assumed: false
  catch_rate_misbehavior_human_post_hoc:
    value: 0.3
    range:
    - 0.1
    - 0.5
    quality: assumed
    grounding: d
    source: 'scenario; no measured rate. Context: METR (2025) notes manual recognition needs domain knowledge and may get
      harder; McAleese et al. (2024): with LLM critiques, contractors found substantial problems in 24% of ChatGPT training
      data rated flawless (6% in a no-critique replication)'
    note: engine key reliability.d_m_review (unlinked); likewise d_m_approval 0.85 has no measured source (d)
    assumed: true
  residual_share_after_review:
    value: 0.45
    range:
    - 0.17
    - 0.8
    unit: share of AI errors that survive one review (1 - catch rate)
    quality: peer_reviewed
    grounding: b
    analogy: as catch_rate_ordinary (Panko 1999) for the low end; Dratsch et al. (2023) and Si et al. (2024) for the high end
    source: '1 - 0.83 (group inspection) to 1 - 0.20 (inexperienced readers facing wrong AI suggestions)'
    note: evidence for params.yaml error_rate_epsilon_A.residual_after_review_factor (now 0.2 [0.05, 0.5], class d); the
      evidence puts it higher, 0.17-0.8
    assumed: false

