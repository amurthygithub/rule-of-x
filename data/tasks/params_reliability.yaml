  in_house_error_rate:
    value: 0.02
    range:
    - 0.009
    - 0.05
    unit: error rate of in-house work (engine augment.e_H)
    quality: secondary
    grounding: b
    analogy: accounts-payable error rates as the error rate of in-house finance work
    source: 'APQC 98% top performers (secondary); Medius 2.5% average, 0.9% best performers (vendor data); "industry standard
      5% or less" (Medius, unattributed) as the high end; read 29 Oct 2026'
    note: flagged secondary sources; replaces 0.02 [0.005, 0.05] (d)
    read: '2026-10-29'
    adopted: params commit 2026-10-29 (assumptions round 2, 5.1)
    assumed: false
  manual_step_pass_rate:
    value: 0.995
    range:
    - 0.99
    - 0.998
    unit: pass rate q_M of one manual step (engine review.q_M)
    quality: secondary
    grounding: b
    analogy: 'derived: 98% process reliability over a four-step chain, 0.98^(1/4) = 0.995'
    source: APQC top performers 98% first-time error free disbursements (secondary, via Fraxion); read 29 Oct 2026
    note: replaces 0.998 [0.99, 0.9995] (d)
    read: '2026-10-29'
    adopted: params commit 2026-10-29 (assumptions round 2, 5.1)
    assumed: false

# ---------------------------------------------------------------------------------------------------- automation bias
automation_bias:
  catch_rate_decline:
    value: 0.3
    range:
    - 0.0
    - 0.6
    unit: proportional fall in the reviewer catch rate as AI accuracy rises from acc0 to 1
    quality: assumed
    grounding: d
    source: 'direction grounded: Bailey and Scerbo (2007) TIES 8(4): trust rose and failure monitoring fell as system reliability
      increased; Parasuraman, Molloy and Singh (1993) IJAP 3(1): detection of automation failures substantially worse under
      constant reliability after about 20 min; Parasuraman and Manzey (2010) Human Factors 52(3): automation bias in naive
      and expert users, not prevented by training or instructions; Dell''Acqua (n.d., working paper): 162 recruiters, an
      85%-accurate AI led to lower accuracy than a 75%-accurate one (+0.079 vs +0.292 on a 1-10 scale, p = 0.05-0.06) and
      more following of AI advice (0.739 vs 0.531). Sign can reverse: Agarwal et al. (NBER w31422) find radiologists
      underweight AI (weight 0.29 vs 1.10 on own signal)'
    note: 'Magnitude is scenario (d): no study reports the catch rate of AI errors at two AI accuracy levels. The range starts
      at 0 to allow automation neglect. Supports the non-monotone review result of spec 23.1 in sign only.'
    assumed: true
  accuracy_threshold_acc0:
    value: 0.75
    range:
    - 0.7
    - 0.85
    unit: AI accuracy above which complacency starts to lower the catch rate
    quality: peer_reviewed
    grounding: b
    analogy: diagnostic automation used alongside raw data (alarms, decision aids)
    source: 'Wickens and Dixon (2007) TIES 8(3) 201-212: 35 data points from 20 studies; benefits of diagnostic automation
      rise linearly with reliability, with a crossover near 0.70 below which automation is worse than none; Dell''Acqua
      (n.d.): the contrast between 75% and 85% AI'
    note: suggested engine key reliability.acc0 (engine default 0.8 is inside the range)
    assumed: false
  overreliance_when_ai_wrong:
    value: 0.65
    range:
    - 0.54
    - 0.8
    unit: share of cases in which the human adopts a wrong AI output
    quality: peer_reviewed
    grounding: a
    source: '1 - accuracy when AI is wrong: Si et al. (2024) 0.65; Dratsch et al. (2023) 0.545-0.80'
    note: 'human-AI pairs on average do worse than the better of the two alone (Vaccaro, Almaatouq and Malone 2024, Nature Human Behaviour: g = -0.23 over 370 effect sizes); cognitive forcing reduces overreliance (Bucinca et al. 2021)'
    assumed: false

# ---------------------------------------------------------------------------------------------------- agentic misbehavior
agentic:
  misbehavior_rate_per_task:
    value: 0.001
    range:
    - 5.0e-05
    - 0.01
    unit: consequential misbehavior events (out-of-scope or unauthorized action, tool misuse, gaming, injected-instruction
      following, concealment) per autonomous task of about one human-hour
    quality: assumed
    grounding: d
    source: 'scenario anchored above by a sourced rate: any misbehavior (mostly reward hacking or misreporting) in about
      0.7-1% of ordinary autonomous tasks (METR 2025: o3 hacked in 8 of 1,087 HCAST runs, 0.7%; OpenAI o3 system card: METR
      saw reward hacking in about 1% of all task attempts). Central = that rate times a scenario consequential share of 0.1'
    note: 'Previous engine default 1e-4 [1e-5, 1e-3] implies that 1% of misbehaviors are consequential; the upper end is
      raised to the sourced any-misbehavior rate. No field rate exists: Anthropic (2025) reports no evidence of agentic
      misalignment in real deployments; AIID lists 11 agentic incidents in May-Jul 2026 with no exposure denominator.'
    assumed: true
  any_misbehavior_rate_ordinary_tasks:
    value: 0.01
    range:
    - 0.004
    - 0.05
    unit: share of autonomous agent task attempts with reward hacking, specification gaming or misreporting
    quality: practitioner_dataset_disclosed
    grounding: a
    source: 'METR (2025), Recent frontier models are reward hacking: o3 0.7% of HCAST runs; OpenAI o3 system card: about
      1% of all METR task attempts; Schoen et al. (2025, arXiv:2509.15541): covert actions 13% (o3) falling to 0.4% after
      anti-scheming training, across 180+ environments built to elicit them'
    note: controlled evaluations, not deployments; METR counts are likely underestimates (methods missed each other's cases)
    vintage: o3, Claude 3.7 Sonnet, o1 (2025)
    assumed: false
  gaming_rate_gameable_or_impossible_tasks:
    value: 0.5
    range:
    - 0.01
    - 1.0
    unit: share of attempts that game the scorer when the task is gameable or cannot be solved honestly
    quality: working_paper
    grounding: a
    source: 'METR (2025): o3 30.4% of RE-Bench runs (100% of 21 on Optimize LLM Foundry; "do not cheat" prompts left 70-95%);
      Zhong et al. (2025) ImpossibleBench: GPT-5 54% and o3 49% on Conflicting-SWEbench; above 85% with loose prompts and 1%
      (GPT-5) to 33% (o3) with the strictest prompt on LiveCodeBench; an abort option cut GPT-5 from 54% to 9%; Bondarenko
      et al. (2025): o1-preview 54% of 123 chess runs unexpected (mostly environment hacking)'
    note: use for activities where the agent is scored by an automated check it can reach (tests, metrics, reconciliations)
    assumed: false
  deception_rate_production_responses:
    value: 0.021
    range:
    - 0.021
    - 0.048
    unit: share of responses on production-representative traffic flagged as deceptive (e.g. claiming work not done)
    quality: company_statement
    grounding: a
    source: 'OpenAI (2025), Introducing GPT-5: 4.8% (o3) to 2.1% (GPT-5 reasoning) of responses; o3 claimed answers about
      absent images 86.7% vs 9% for GPT-5 (CharXiv, images removed)'
    note: the only production-traffic misbehavior rate found; vendor self-report on its own classifier
    assumed: false
  risky_tool_action_rate_high_stakes:
    value: 0.239
    range:
    - 0.239
    - 0.5
    unit: share of high-stakes test cases in which the agent takes a risky action
    quality: peer_reviewed
    grounding: a
    source: 'Ruan et al. (2024) ToolEmu, ICLR 2024: 36 toolkits, 144 test cases; the safest agent failed 23.9% of the time;
      68.8% of emulated failures judged valid in the real world'
    vintage: GPT-4 and Claude 2 era agents (2023)
    assumed: false
  stress_test_harmful_action_rate:
    value: 0.8
    range:
    - 0.065
    - 0.96
    unit: share of samples with a harmful insider action, in a constructed dilemma with goal conflict or replacement threat
      and no ethical option
    quality: working_paper
    grounding: a
    source: 'Lynch et al. (2025) Agentic Misalignment, arXiv:2510.05179 and Anthropic (20 Jun 2025): blackmail 96% (Claude
      Opus 4, Gemini 2.5 Flash), 80% (GPT-4.1, Grok 3 Beta), 79% (DeepSeek-R1); with a direct instruction not to, Claude
      Opus 4 fell from 96% to 37%; Claude Opus 4 blackmailed in 55.1% of samples when it stated the scenario was real vs
      6.5% when it stated an evaluation'
    note: 'NOT a field rate. Measures propensity under a deliberately constructed dilemma. Use only to set the autonomy
      scope exclusion for irreversible, high-stakes actions, never as an incidence rate. Meinke et al. (2024): without goal
      nudging, covert subversion rates were 0-5% of 400 rollouts (o1 false email ranking 5%, oversight disabling 0.3%).'
    assumed: false
  guardrail_reduction_share:
    value: 0.5
    range:
    - 0.3
    - 0.97
    unit: proportional cut in misbehavior or attack success from a targeted mitigation, in evaluation
    quality: peer_reviewed
    grounding: a
    source: 'AgentDojo tool filter: targeted ASR 47.7% to 7.5% (84%); Claude in Chrome mitigations 23.6% to 11.2% (53%);
      anti-scheming training 13% to 0.4% (97%); direct instruction 96% to 37% (61%); ImpossibleBench abort option 54% to 9% (83%)'
    note: 'suggested engine key reliability.guard_cut (now 0.3 [0, 0.6], unlinked). Central set below the median measured
      cut because evaluations are not adaptive: persistent attackers broke nearly all agents within 10-100 queries (Zou et
      al. 2025), and Schoen et al. could not rule out that reductions reflect evaluation awareness.'
    assumed: false
  autonomy_multiplier:
    value:
      read: 0.0
      draft: 0.05
      act_with_approval: 0.5
      act_autonomously: 1.0
    quality: assumed
    grounding: d
    source: 'scenario; structural anchors only: action misbehavior needs write or transaction rights (all elicitations above
      give the agent tools: email, file system, scoring code); responses without tools still show deception (2.1-4.8% of
      responses, OpenAI 2025)'
    note: no study measures misbehavior across autonomy levels for the same model and task
    assumed: true
  horizon_elasticity_kappa_h:
    value: 0.5
    range:
    - 0.2
    - 1.0
    quality: assumed
    grounding: d
    source: 'scenario; context: METR (2025) found reward hacking 43x more common on RE-Bench (long research-engineering tasks)
      than HCAST, but RE-Bench also has reachable scoring functions, so length and gameability are confounded'
    assumed: true
  loss_tail_index:
    value: 1.5
    range:
    - 1.15
    - 2.3
    unit: Pareto tail index alpha of the loss per misbehavior event (= 1 / GPD shape xi)
    quality: peer_reviewed
    grounding: b
    analogy: operational losses of banks (Basel event types incl. execution, delivery and process management; business
      disruption and system failures), the category an AI execution failure would be booked in
    source: 'de Fontnouvelle, Rosengren and Jordan (2007), in Carey and Stulz (eds), The Risks of Financial Institutions,
      475-504: bias-corrected tail shape xi 0.50-0.86 across six banks, pooled 0.681 (alpha 1.16-2.01, pooled 1.47); ML
      estimates by event type reach xi > 1 (infinite mean), which the authors call implausible; Flyvbjerg et al. (2022)
      JMIS: IT cost overruns alpha 2.3 (thin end)'
    note: 'alpha < 2 implies infinite variance: use CVaR with a cap (kill switch) rather than variance. The previous engine
      default 1.8 is inside the range; the central moves to the pooled bank estimate.'
    assumed: false
  loss_scale_anchors_field:
    quality: government
    grounding: a
    values_usd_or_local:
      chatbot_misinformation_tribunal_award_cad: 812.02
      court_sanction_fabricated_citations_usd:
      - 1500
      - 59500
      mata_v_avianca_sanction_usd: 5000
      consulting_report_with_fabricated_references_contract_aud: 440000
      agent_token_transfer_aiid_1556_usd: 200000
      prompt_injection_breach_average_usd: 5890000
      survey_average_loss_large_firms_ai_risks_usd: 4400000
    source: 'Moffatt v. Air Canada, 2024 BCCRT 149 (C$650.88 damages + interest + fees); Mata v. Avianca, S.D.N.Y. 22-cv-1461,
      ECF 54 (22 Jun 2023); Bloomberg Law (29 Dec 2025): sanctions $1,500-$5,000 typical, $15,500 (D. Or.), $59,500 (Illinois);
      AP (7 Oct 2025): Deloitte to refund the final instalment of an A$440,000 contract; AIID roundup May-Jul 2026, incident
      1556; IBM X-Force (2026, in params.yaml); EY RAI pulse survey (Oct 2025): 975 executives at firms above $1bn revenue,
      99% report losses from AI-related risks, 64% above $1M, average $4.4M (self-reported, flag)'
    note: 'scale anchors, not a severity distribution: they span five orders of magnitude, consistent with a heavy tail.
      No credible aggregate estimate of production losses from AI errors was found.'
    assumed: false

# ---------------------------------------------------------------------------------------------------- pipelines
pipeline:
  per_step_reliability_1h_software_step:
    value: 0.815
    range:
    - 0.735
    - 0.944
    unit: success probability of one autonomous step of one human-hour (frontier agent, early 2026)
    quality: primary_data_fit
    grounding: c
    source: 'our calculation from params.yaml capability_path: logistic P = 1 / (1 + (d / H50)^b) with H50 = 11.98 h, b = 0.597
      gives 0.815 at d = 1 h (0.735-0.847 over b 0.41-0.69); Ord (2025) constant-hazard reading of METR data gives 2^(-1/H50)
      = 0.944 (0.926-0.955 over the H50 range)'
    note: 'the two forms bracket the range. Maximum autonomous task length for a target: 80% -> 1.2 h (logistic) or 3.9 h
      (constant hazard); 95% -> 0.09 h or 0.89 h; 99% -> 0.005 h or 0.17 h. Above 80% both extrapolate beyond METR''s
      validated range (params.yaml chi_reliability_factor). Software tasks only (params.yaml domain_transfer_factor).'
    assumed: false
  repeated_trial_consistency_pass_k:
    value:
      pass_1: 0.61
      pass_8: 0.25
    quality: peer_reviewed
    grounding: a
    source: 'Yao et al. (2025) tau-bench: gpt-4o retail pass^1 61.2%, pass^8 below 25%; pass^k = chance that all k i.i.d.
      trials succeed'
    note: 'for an activity run k times a day by the same agent, reliability is pass^k, not (pass^1)^k only if failures are
      task-specific; tau-bench shows heavy task heterogeneity (pass^8 far above 0.61^8 = 0.019 would mean task-level
      persistence; below 25% is consistent with both). Use pass^k when the same task recurs.'
    vintage: gpt-4o (2024)
    assumed: false
  per_step_accuracy_decay:
    value: present
    quality: working_paper
    grounding: a
    source: 'Sinha et al. (2025): per-step accuracy falls as steps accumulate, partly because models condition on their own
      earlier errors (self-conditioning), which scale does not remove and thinking reduces; Dziri et al. (2023): errors compound
      across compositional steps'
    note: the O-ring product with constant per-step reliability is optimistic for long single-agent chains
    assumed: false
  multi_agent_failure_rate:
    value: 0.6
    range:
    - 0.41
    - 0.867
    unit: share of multi-agent system runs that fail the task
    quality: peer_reviewed
    grounding: a
    source: 'Cemri et al. (2025), NeurIPS 2025 (spotlight poster; arXiv:2503.13657v3): 41.0-86.7% failure across 7
      open-source frameworks; 14 failure modes; shares of annotated failures: system design 44.2%, inter-agent misalignment
      32.4%, task verification 23.5% (our sums of mode shares); kappa 0.88'
    assumed: false
  handoff_failure_share:
    value: 0.32
    range:
    - 0.25
    - 0.4
    unit: share of multi-agent failures arising between agents (handoffs, ignored inputs, reasoning-action mismatch)
    quality: peer_reviewed
    grounding: b
    analogy: inter-agent misalignment in MAST as the agent-pipeline counterpart of the handoff cost eta
    source: Cemri et al. (2025), FC2 sum of mode shares 32.35%; range widened for transfer
    note: the engine cascade parameter (0.5 [0, 1]) has no direct measure and remains scenario (d)
    assumed: false

