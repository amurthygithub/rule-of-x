    source: '90-day uptime to Sep 2026 (status pages via Notebookcheck): OpenAI API 99.94% (5 h/yr, 0.2 day), ChatGPT 99.64%
      (1.3 days), Claude API 99.5% (1.8 days), claude.ai 99.4% (2.2 days); disclosed regressions: OpenAI GPT-4o sycophancy
      (Apr 2025), Anthropic infrastructure bugs (Aug-Sep 2025), Anthropic Claude Code changes (Mar-Apr 2026), i.e. about
      1-2 a year per provider'
    note: engine nu_cm with cm_days = 1; 0.2-2.2 outage day-equivalents plus 1-2 regressions a year gives about 1-4. Status
      pages are self-reported by providers (flag).
    assumed: false
  short_incidents_per_year:
    value: 150
    range:
    - 50
    - 200
    unit: status-page incidents (elevated errors, degraded performance) per provider per year
    quality: practitioner_dataset_disclosed
    grounding: a
    source: 'Anthropic status page (read 29 Oct 2026): 8 model-related incidents of 11-35 min in 15 days (about 190 a year),
      plus 3 connector incidents; IsDown (Nov 2024): OpenAI reported 100 incidents Jan-Sep 2024 (about 133 a year), 40 major
      averaging about 3 h, 60 minor averaging about 1.5 h'
    assumed: false
  downtime_hours_per_year:
    value: 30
    range:
    - 5
    - 55
    quality: practitioner_dataset_disclosed
    grounding: a
    source: 90-day uptime figures above x 8,760 h (Notebookcheck, 4 Sep 2026, from status.openai.com and status.claude.com)
    note: suggested engine key; cm_days x nu_cm = 0.2-2.3 days a year from outages alone
    assumed: false
  regression_episode:
    duration_days:
      value: 14
      range:
      - 3
      - 45
    peak_share_of_requests_affected:
      value: 0.16
      range:
      - 0.008
      - 0.3
    quality: company_statement
    grounding: a
    source: 'OpenAI (2 May 2025): sycophantic GPT-4o update live 24/25 to 28 Apr 2025, rollback about 24 h, offline evals
      and A/B tests missed it; Anthropic postmortem (Sep 2025, via InfoQ and GIGAZINE, secondary): routing bug from 5 Aug,
      0.8% of requests at first, 16% of Sonnet 4 requests at the worst hour (31 Aug), fixed 4 Sep; TPU and compiler bugs
      for days to about two weeks; Anthropic (23 Apr 2026): three Claude Code changes from 4 Mar to 20 Apr 2026, one eval
      showed a 3% drop; Chen, Zaharia and Zou (2024) HDSR: GPT-4 prime identification 84.0% to 51.1% and directly executable
      code 52.0% to 10.0% between Mar and Jun 2023'
    note: suggested engine key reliability.cm_burst uses value lost per burst; detection came from users, not provider evals,
      in all three disclosed cases
    assumed: false
  cross_model_attack_transfer:
    value: 0.47
    range:
    - 0.02
    - 0.87
    unit: attack success on a target model of an attack optimized on other (open) models
    quality: working_paper
    grounding: a
    source: 'Zou, Wang, Carlini, Nasr, Kolter and Fredrikson (2023, arXiv:2307.15043): ensemble suffix attack transfer 86.6%
      (GPT-3.5), 46.9% (GPT-4), 66.0% (PaLM-2), 47.9% (Claude-1), 2.1% (Claude-2) over 388 behaviors'
    note: shared vulnerabilities are partly common across providers, so diversity helps only when the second model is not
      exposed to the same attack; the cross-provider correlation of failures remains scenario (d)
    assumed: false
  common_mode_loss_precedent:
    value: 5400000000
    unit: USD direct loss to Fortune 500 (excluding Microsoft) from one vendor update, CrowdStrike, 19 Jul 2024
    quality: secondary
    grounding: b
    analogy: a single faulty update pushed to many dependent systems at once, as a model update would be to every process
      using that model
    source: 'Parametrix estimate reported by Insurance Business (25 Jul 2024): $5.4bn, average $44M per affected company;
      healthcare $1.94bn, banking $1.15bn; insured share 10-20% ($0.54-1.08bn)'
    note: not an AI incident; insurer model estimate read in a trade-press report
    assumed: false
  provider_correlation:
    value: 1.0
    range:
    - 0.3
    - 1.0
    quality: assumed
    grounding: d
    source: scenario; within one provider, an incident hits every process on that model (correlation 1); across providers
      no measured correlation was found
    note: 'the cross-provider joint-error rate stays d (unmeasured). Kim, Garg, Peng and Garg (ICML 2025) show joint errors
      far above independence, rising with accuracy, so H_cm is a lower bound on effective concentration: providers share
      base models, cloud regions and corpora (assumptions round 2, Section 6; params commit 29 Oct 2026)'
    assumed: true
  cross_provider_identical_error_share_given_joint_error:
    value: 0.6
    range:
    - 0.42
    - 0.6
    unit: P(same wrong answer | both models wrong), for a pair of models from different providers; NOT P(B wrong | A wrong)
    quality: peer_reviewed
    grounding: a
    grounding_transfer: b
    analogy: academic multiple-choice benchmarks (HELM and HuggingFace MMLU) and resume screening, transferred to enterprise
      checks that compare two models' outputs
    source: 'Kim, Garg, Peng and Garg (2025), Correlated Errors in Large Language Models, ICML 2025, PMLR 267 (arXiv:2506.07962v1,
      html and PDF; read 29 Oct 2026): mean error agreement 0.60 on HELM (71 models, 15 companies, 14,042 MMLU questions,
      independence baseline 1/3) and 0.423 on the HuggingFace leaderboard (349 models, baseline about 0.127); 97.5% and 100%
      of pairs above baseline; more accurate models have more correlated errors'
    note: 'class a for the benchmark, b for the transfer. Use: when two layers on different providers both err, a disagreement-based
      check misses the joint error with this probability. The paper reports neither P(B wrong | A wrong) nor the ratio of
      joint to product error rates, so this is not a common-mode probability p_cm and must not be used as a conditional error
      rate. No engine key: no engine or Part II computation models agreement between providers'' errors (params commit 29
      Oct 2026); cite for the direction in P1 Ass. 7, P2 prop:ext-commonmode and prop:acct-amin.'
    read: '2026-10-29'
    adopted: params commit 2026-10-29 (assumptions round 2, 6)
    assumed: false

