#   augment.e_H       -> human_baseline.in_house_error_rate
human_baseline:
  first_time_error_free_disbursements_top_performers:
    value: 0.98
    unit: share of accounts-payable disbursements that are first-time error free, 75th-percentile performers
    quality: secondary
    grounding: b
    source: 'APQC Open Standards Benchmarking, "percentage of disbursements that are first time error free", as cited by
      Fraxion (fraxion.biz/blog/ap-performance-benchmarks; secondary; read 29 Oct 2026): top performers 98%; duplicate or
      erroneous payments about 0.8% (high performers) to 2%; Medius, Benchmarking AP accuracy (medius.com/blog/benchmarking-ap-accuracy-and-understanding-acceptable-invoice-error-rates/;
      vendor data; read 29 Oct 2026): customers average 97.5% first-time-right, best performers 99.1%'
    note: 'APQC primary values (Benchmarks on Demand) not read; recorded as "values not read" until a member retrieves them.
      Ardent Partners exception rates (22.6% average, 10.1% best in class) measure exceptions, not errors, and are not used.'
