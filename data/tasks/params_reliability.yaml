    - 0.995
    unit: reliability target r_bar for finance, legal and risk steps (engine review.r_bar_high)
    quality: secondary
    grounding: b
    analogy: human parity at top-performer accounts-payable accuracy; 0.99 is the stretch case
    source: APQC top performers 98% first-time error free (secondary, via Fraxion); Medius best performers 99.1% (vendor data);
      read 29 Oct 2026
    note: replaces 0.99 [0.98, 0.999] (d). The invoice example's "no readiness level makes full automation positive" in
      the conditional case depended on the 0.99 target (assumptions round 2, Section 5.1).
