      shock'
    unit: 'industry pass-through RATE phi, the share of a common unit-cost change that reaches the output price. Paper 1 round
      2 (B1, 2 Nov 2026) applies it to every unit-cost saving (cost of revenue, compute and the non-discretionary floors;
      Prop. entry(d)), with margins at the post-cut price: the after-tax margin term is (1 - tau)(1 - f - K/(1 - phi S))'
    note: 'consumers: code/calibrate_horizons.py (scenario dimension; rate on all unit-cost savings at the post-cut price;
      dur = 1 - phi (1 - HHI) at the engine''s HHI is reported as the dollar-profit share and not used in the score); engine
      competition.phi_ind_scenarios (named scenarios pass_through_0, _50, _70), formulas.passthrough_terms (score) and the
      durable share (dollars). The central engine value is competition.phi_ind = 0.5; the derived Cournot phi_ind = n_c/(n_c
      + 1 - e) is a benchmark. Removed anchor (Paper 1 round 2, A9 and IO2-2): Demirer, Fradkin, Tadelis and Peng report a
      preliminary within-model price elasticity of about -1.1 across providers of the same open model, which measures
      substitution between providers, not the pass-through of cost to price; it is not evidence of pass-through near one.'
