part1_ceiling:
  meta:
    formula: 'G* = 1 - (1 - tau)(1 - c_c - f - a_min): market growth at which R_max = 1 with k = 0, X = 1, psi = 0'
    central_threshold: 0.2743
    one_at_a_time_threshold_range:
      tau:
      - 0.2478
      - 0.3009
      cc:
      - 0.2333
      - 0.3891
      f:
      - 0.2702
      - 0.2784
      amin:
      - 0.262
      - 0.2989
    used_in: sections/model.tex Cor ceiling and tab:ceiling (31/39/48/55% thresholds); intro.tex; code/calibrate_horizons.py
      (TAU, M0_CAP); engine finance.tau, fees_f, a_min_fixed
  tau_cash_tax_rate:
    value: 0.18
    range:
    - 0.15
    - 0.21
    quality: government
    assumed: false
    grounding: b
    source: 'bounds: 21% federal rate, 26 U.S.C. 11(b) ("21 percent of taxable income", uscode.house.gov); 15% corporate alternative
      minimum tax on adjusted financial statement income for corporations with average annual AFSI above $1 billion, tax years
      beginning after 31 Dec 2022 (IRS, Inflation Reduction Act CAMT page). Wider evidence: GAO-23-105384 (2023): average
      effective rate of profitable large corporations fell from 16% (2014) to 9% (2018)'
    analogy: a mature, profitable firm at the ceiling is large enough for the CAMT floor; state taxes are excluded, as in
      the paper
    note: central 0.18 is the midpoint, not an estimate. The widest credible range is [0.09, 0.21] plus state tax; the 9%
      GAO average predates the CAMT.
  a_min_accountability_floor:
    value: 0.03
    range:
    - 0.005
    - 0.046
    quality: primary_data_fit
    assumed: false
    grounding: b
    source: 'lower bound: direct accountability costs, since Paper 1 round 2 (C3, 2 Nov 2026) the KPMG 2025 SOX program budget
      of a firm under $5B of revenue ($1.5M; security_and_maintenance.compliance.sox_program_cost_kpmg_2025_reference.by_revenue_size)
      plus the accelerated-filer average audit fee ($1,492,375; audit_fee_accelerated_filer_reference), 0.30% of revenue
      for a $1B firm (0.18% with the S&P 500 fee ratio of $343 per $1M, 0.68% with the large-accelerated fee); before round
      2, the S&P 500 ratio plus the SEC OEA 2009 median Section 404 cost ($1.04M), 0.14%. With the cheapest admissible control
      design the bottom-up floor is about 0.37-0.38% (Paper 1 macros AminFloor, AminFloorOne), below the band''s 0.5%. Upper bound: our calculation from the SEC XBRL
      panel (data/panel_v2_all.csv, SIC 7370-7374, FY2023-25 firm means): total G&A share p5 0.046 and p10 0.063 for revenue
      $1B-10B (96 firms), p5 0.029 and p10 0.032 above $10B (12 firms)'
    analogy: the accountability floor after full automation cannot exceed the whole G&A of today's leanest software firms,
      and cannot fall below the audit and control costs the law requires
    ga_share_by_size:
      rev_1b_10b:
        n_firms: 96
        p5: 0.046
        p10: 0.063
        median: 0.118
      rev_over_10b:
        n_firms: 12
        p5: 0.029
        p10: 0.032
        median: 0.069
    note: the paper's central 3% equals the p10 G&A share of software firms above $10B (all of today's G&A kept); the favorable
      1.5% lies inside the band; the conservative 6% lies above the p5 G&A share of $1B-10B firms and outside the band. G&A
      includes SBC.
  c_c_compute_share:
    value: 0.06
    range:
    - 0.01
    - 0.2
    quality: working_paper
    assumed: false
    grounding: b
    basis: 2025 prices, no price path (b-anchored)
    source: 'c_c = s_L x kappa (assumptions round 2, Section 2; read 29 Oct 2026). kappa at 2025 prices 0.10 [0.01, 0.35]
      (b): METR agent runs (ai_cost.inference_cost_usd_per_human_hour: median 0.08-1.14% of the human baseline cost across
      6 recent agents, METR TH1.0; c); Stevens (2026), Payrolls to Prompts, arXiv:2602.00139: about $0.03 of AI spend per
      $1 of displaced freelance labor (a, preprint); AI-native products, inference 13-23% of revenue at 2025 prices (ICONIQ
      2026 via SaaStr, secondary; the revenue mapping is the auditor''s calculation); central 0.10 = geometric middle of the
      field analogs. s_L 0.60 [0.50, 0.65] (c): labor cost the ceiling automates, share of revenue'
    by_horizon:
      '2028':
        value: 0.12
        range:
        - 0.02
        - 0.3
        grounding: d
        model: 0.119
      '2031':
        value: 0.08
        range:
        - 0.01
        - 0.25
        grounding: d
        model: 0.0794
      '2036':
        value: 0.05
        range:
        - 0.01
        - 0.2
        grounding: d
        model: 0.0497
    path:
      s_L: 0.6
      s_L_range:
      - 0.5
      - 0.65
      kappa_2025: 0.1
      kappa_2025_range:
      - 0.01
      - 0.35
      D: 5.0
      D_range:
      - 3.0
      - 10.0
      floor_share: 0.005
      kappa_front: 0.33
      kappa_front_range:
      - 0.1
      - 0.5
      omega:
        '2028': 0.6
        '2031': 0.4
        '2036': 0.25
      omega_range:
        '2028':
        - 0.3
        - 0.9
        '2031':
        - 0.2
        - 0.7
        '2036':
        - 0.1
        - 0.5
      formula: c_c(H) = s_L [omega_H kappa_front + (1 - omega_H) max(kappa_2025 / D^(H - 2025), floor_share kappa_2025)]
      sources: 'D = 5 [3, 10] a year: Gundlach, Lynch, Mertens and Thompson (2026), arXiv:2511.23455v2, fixed-performance
        price down 5-10x a year (a); kappa_front = 0.33 [0.10, 0.50] (d), capped by the value test kappa < 1, so c_c <= s_L
        (Paper 1 round 2, B2: the earlier cap kappa < 1 - review share, c_c <= 0.5 s_L, had no source and the full-automation
        ceiling has no human review; frontier cost up 3-18x a year is capped by abandonment, not extrapolated); omega_H (d): share of automated labor
        cost in tasks reached within two years of H; floor_share = engine prices.floor_share (d)'
    high_compute_case:
      value: 0.4
