    source: 'central precedent (work changed): World Economic Forum, Future of Jobs Report 2025, digest (weforum.org/publications/the-future-of-jobs-report-2025/digest/;
      read 29 Oct 2026): over 1,000 employers, 14 million workers, 55 economies; 59 of 100 workers need training by 2030,
      about 12 a year. Exit-based bracket: single-year reductions in filings, Salesforce about 10% (Form 8-K, 4 Jan 2023),
      Alphabet about 6% (about 12,000 roles, Jan 2023), Meta 22% of headcount in 2023 (67,317 at 31 Dec 2023; Q4 2023 results
      release); BLS JOLTS, August 2026: layoffs and discharges 1.0% a month (about 12% a year), total separations 3.2% a month'
    note: 're-grounded by assumptions round 2 (Section 1.2): layoffs measure exits, the parameter counts employees whose work
      changes; WEF measures that concept and lands on the same value. Upper bound 0.20 -> 0.22 (Meta 2023).'
