      value_test_cap: 0.6
      note: 'within the value-test cap c_c <= s_L = 0.60 (Paper 1 round 2, B2, 2 Nov 2026; code/calibrate_horizons.py
        CC_VALUE_TEST_FACTOR = 1.0), so feasible at full automation (G* 61.3%, Paper 1 macro GstarHigh). Before round 2 the
        cap was s_L x 0.5 = 0.30, a factor with no source, and the case was labelled infeasible. Credible range of c_c at
        2025 prices against the cap: 1-60% (G* 28-78%, Paper 1 macros GstarCcLo, GstarCcHi); the old cap 0.30 gives G* 52.8%
        (GstarCcOldCap)'
    previous:
