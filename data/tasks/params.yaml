capability_path:
  H0_hours_p50:
    value: 11.98
    range:
    - 8.99
    - 14.98
    quality: primary_data_fit
    source: METR Time Horizon 1.1 run data (github.com/METR/eval-analysis-public), refit by 06_capability.py
    unit: human hours at 50% success
    note: frontier agent Claude Opus 4.6 (Inspect); METR reports measurements above 16 h as unreliable with the current task
      suite. Software tasks only.
    assumed: false
    grounding: c
  H0_hours_p80:
    value: 1.16
    range:
    - 0.87
    - 1.46
    quality: primary_data_fit
    source: as H0_hours_p50
    unit: human hours at 80% success
    assumed: false
    grounding: c
  t0:
    value: '2026-02-05'
    range: null
    quality: primary_data_fit
    source: release date of the frontier agent, METR release_dates.yaml
    assumed: false
    grounding: c
  T_d_days:
    value: 143
    range:
    - 102
    - 240
    quality: peer_reviewed
    source: 'Kwa et al. (2025), Measuring AI Ability to Complete Long Software Tasks, arXiv:2503.14499, NeurIPS 2025: 207
      days (95% CI 166-240) for 2019-2025, 143 days for 2024-onward models'
    unit: days per doubling of the 50% horizon
    note: 'Default 143 (published, 2024-onward). Our refits, reported alongside: TH1.0 data 2019+ 201.2 d, TH1.0 2024+ 131.3
      d; TH1.1 data 2023+ 128.7 d (95% CI 106.3-158.2), TH1.1 2024+ 102.2 d (95% CI 81.6-126.1). Low end of range = fastest
      refit; high end = upper CI of the published long-run estimate.'
    assumed: false
    grounding: a
  T_d_scenarios_days:
    slow: 207
    base: 143
    fast: 102.0
    source: slow and base published (Kwa et al. 2025); fast = TH1.1 2024+ refit
  logistic_slope_b:
    value: 0.597
    range:
    - 0.41
    - 0.69
    quality: primary_data_fit
    source: 'METR TH1.1 refit: |coefficient| of success on log2(human minutes), median over agents released 2025+'
    note: P(success | task length d) = 1 / (1 + (d / H50)^b). Range = min and max over those agents.
    assumed: false
    grounding: c
  chi_reliability_factor:
    value:
      '0.5': 1.0
      '0.8': 4.99
      '0.9': 12.8
      '0.95': 30.45
      '0.99': 206.63
      '0.999': 3019.12
    quality: primary_data_fit
    assumed: false
    source: 'derived from logistic_slope_b: H50 / H_r = 2^(logit(r) / b)'
    note: Anchored empirically at r = 0.8 (Kwa et al. report 80% horizons 4-6x shorter; our refit 5.0). Values above 0.8 extrapolate
      the logistic form and are not validated by METR data.
    grounding: c
  domain_transfer_factor:
    value: 1.0
    range:
    - 0.5
    - 9.5
    quality: practitioner_dataset_disclosed
    source: 'Anthropic Economic Index report, 15 Jan 2026 (anthropic.com/research/economic-index-primitives, re-read 29 Oct
      2026): Claude "50% successful at tasks that take ... around 3.5 hours" on the API and "around 19 hours" on Claude.ai,
      for Claude Sonnet 4.5, which METR measures at 50% success on 2-hour tasks; the report says its method differs from METR''s
      (user-guided task breakdown, selection)'
    note: multiplies H for non-software or in-product tasks. Upper bound 19/2 = 9.5 (Claude.ai), API 3.5/2 = 1.75; Kwa et
      al. (2025) find lower success on messier tasks, so values below 1 are allowed. Central 1 lies between the API ratio
      (biased up by user selection) and the messiness penalty.
    assumed: false
    grounding: b
    analogy: user-guided Claude tasks (API and Claude.ai) relative to METR software tasks for the same model; transfer to
      enterprise processes is the stated analogy
    conditional: the range spans log2(19) = 4.2 horizon doublings (1.6 to 2.4 years at T_d = 143 to 207 days), so feasibility
      dates must be reported over the range
  physical_lag_years:
    value: 5
    range:
    - 2
    - 10
    quality: assumed
    source: 'assumed: lag before world models make physical activities feasible'
    assumed: true
    grounding: d
    note: no credible estimate of a world-model lag exists; scenario dimension
  context_engine_multiplier_kappa_ctx:
    value: 1.0
    range:
    - 1.0
    - 3.0
    quality: assumed
    source: 'assumed: multiplier on effective horizon from organisational context engines'
    assumed: true
    grounding: d
