#
# autofrontier default parameters.
#
# Each leaf is a mapping with:
#   value     the fallback value (used when data/tasks/params.yaml is absent or lacks the entry)
#   range     [low, high]: the span used by the sensitivity tornado and the scenarios
#   params    optional dotted path into data/tasks/params.yaml; when that file is found, its value, range,
#             source and assumed flag replace the fallback (the spec's rule: params.yaml values are the
#             defaults where they exist). `pick` selects a key of a mapping-valued entry; `transform`
#             converts units (days_to_years, date_to_year, months_to_years, ln).
#   source    where a sourced value comes from (verified references are in notes/ref_verification_part2.md)
#   assumed   true when the value is an engine assumption; `basis` then says what informs it
#   flag      quality flag of the evidence (survey, practitioner, unverified)
#   section   the section of notes/unified_model_spec.md or the paper result the parameter belongs to
#
#   rate      for rates: "continuous" (used in e^{-rt}; annual sources enter through transform to_continuous, ln(1 + r))
#             or "annual" (used as (1 + r)^t, or measured annually)
#   grounding the class of spec Section 21.1: a sourced, b grounded by precedent, c calibrated from our own data
#             or the firm's inputs, d a free scenario parameter (reported over its range, never as a point);
#             `setting` marks numerical settings and `policy` marks the firm's own choices (risk appetite,
#             exclusions, budget). Linked leaves take the class of their params.yaml block.
#
# Nothing here cites a source it does not come from. A value only informed by a source is assumed, and the
# source is named in `basis`.

finance:
  r: {value: 0.0893, range: [0.0677, 0.1013], params: "ownership_regimes.public.r_own_wacc", transform: to_continuous, rate: "continuous", basis: "continuous; ln(1 + annual WACC), Damodaran Jan 2026", section: "Part I; spec 9 (discount rate outside a regime preset)"}
  alpha: {value: 0.30, range: [0.25, 0.45], source: "Part I calibration range of the spend elasticity, sections/model.tex (0.3 in examples)", note: "Paper 1 round 2 (F5, IM2-N10/N12; notes/assumptions_register.md, 2 Nov 2026) reclassifies alpha as class d: the data identify only alpha(X - k), so [0.25, 0.45] is a scenario range (0.35 on Paper 1's central path, 0.3 in its levers table). The engine keeps the value 0.30 and does not draw alpha in the Monte Carlo (grounding left as c pending the engine owner's decision: alpha enters only the Part I state, not plan values, and adding it to the drawn set would reshuffle every later draw)", section: "Part I", grounding: "c"}
  tau: {value: 0.21, range: [0.15, 0.30], source: "U.S. federal statutory corporate rate, 26 U.S.C. 11(b); a firm input tax_rate overrides", note: "the marginal statutory rate, right for marginal decisions on savings; Part I uses an average effective rate (central 0.18, params.yaml part1_ceiling.tau_cash_tax_rate) for the full-automation ceiling", section: "spec 5 (taxes)", grounding: "a"}
  psi: {value: null, range: [0.532, 1.0], assumed: true, grounding: "setting", basis: "null: computed as domestic_dev_share x psi_domestic + (1 - domestic_dev_share) x psi_15(r) (prop:acct-tax); a value overrides (the spec 5 tornado uses it)", section: "spec 5, 24.4 (tax deductibility of AI development)"}
  psi_domestic: {value: 1.0, range: [1.0, 1.0], assumed: false, grounding: "a", source: "26 U.S.C. sec. 174A(a), (d)(3): domestic research and experimental expenditure, including software development, is deducted when paid or incurred for taxable years beginning after 31 Dec 2024 (verified in notes/accounting_notes.md Section 2)", section: "spec 24.4"}
  psi_foreign_years: {value: 15, range: [15, 15], assumed: false, grounding: "a", source: "26 U.S.C. sec. 174(a): foreign research is amortized over 15 years from the midpoint of the year (psi_15 = 0.532 at r = 0.10)", section: "spec 24.4"}
  psi_equipment: {value: 1.0, range: [0.80, 1.0], assumed: false, grounding: "a", source: "current law for domestic servers: qualified property acquired after 19 Jan 2025 gets the 100 percent first-year allowance (26 U.S.C. 168(k) as amended by P.L. 119-21 sec. 70301; IRS Notice 2026-11, read by the Paper 2 theory pass on 29 Oct 2026); computers are five-year property (168(e)(3)(B)(iv), (i)(2)(A))", note: "the value for domestic servers without an election. Electing out of the allowance (168(k)(7)) gives no bonus: MACRS five-year, psi 0.86 at the software cost of capital. The 40 percent (60 percent for certain property) is the transitional election of 168(k)(10) for property placed in service in the first taxable year ending after 19 Jan 2025, with the rest under MACRS (psi 0.92). Servers used predominantly outside the United States are ADS property (168(g)(1)(A)) with no bonus (26 CFR 1.168(k)-2(b)(2)(ii)(B)), straight line over five years (168(g)(3)(C)): psi 0.81. Firm inputs bonus_election and foreign_server_share select these (formulas.psi_equipment); the range runs from the ADS value to 1. With psi < 1 the capital hurdles of cor:capital rise by Upsilon = (1 - psi tau)/(1 - tau)", section: "spec 24.4 (equipment); prop:acct-tax(d)"}
  domestic_dev_share: {value: 1.0, range: [0.0, 1.0], assumed: true, grounding: "policy", section: "spec 24.4 (share of development work done in the U.S.; a firm input overrides)"}
  fees_f: {value: 0.025, range: [0.02, 0.03], grounding: "d", source: "Part I Cor ceiling calibration, central case", note: "class d: no processor price page could be read (assumptions memo)", section: "Part I"}
  a_min_fixed: {value: 0.03, range: [0.005, 0.046], params: "part1_ceiling.a_min_accountability_floor", section: "Part I; spec 8, 22"}
  market_growth_G: {value: 0.10, range: [0.05, 0.15], assumed: true, rate: "annual", section: "Part I", note: "used when the firm gives no market growth", grounding: "d"}
  revenue_growth_g: {value: 0.12, range: [0.0, 0.30], assumed: true, rate: "annual", section: "Part I", note: "used when the firm gives no revenue growth", grounding: "d"}
  rd_expansion_share: {value: 0.5, range: [0.3, 0.7], assumed: true, section: "Part I (sigma = S&M plus expansion R&D)", grounding: "d"}
  capital_intensity_k: {value: 0.645, range: [0.22, 2.03], assumed: false, grounding: "b", source: "Damodaran (January 2026) invested capital per dollar of sales on the unadjusted basis (after-tax operating margin over unadjusted after-tax ROC), data/tasks/industry_benchmarks.csv k_ic_per_sales with k_variant unadj: Total Market (without financials) 0.645; range P10 0.22 to P90 2.03 across non-financial groups. The engine uses the firm's industry row through xw_damodaran_naics.csv (Software System & Application 0.574); a firm input capital_intensity_k overrides", note: "Part I k: invested capital per dollar of revenue (investment = k dS). Aggregates over listed US firms, so large firms dominate; book capital includes goodwill", section: "Part I; spec 24.10"}
  X_default: {value: 5.0, range: [2.5, 9.0], assumed: true, grounding: "setting", basis: "the middle evaluation point, not an estimate: Paper 1 withdrew the spend-based weight of 7 to 13 (decision D-1; revision plan A1); the data do not identify the decision weight, and the bounds on alpha (X - k) run from 0.05 to 10.1 by method (notes/sample_audit.md Section 4; X - k from below 1 to about 12 at alpha in [0.25, 0.45]). Used only when the Gordon equation has no root and the firm gives no EV/revenue multiple; every output whose recommendation depends on the level of X is also reported at finance.X_eval_points or the firm's range (lever_map x_levels)", section: "Part I prop:dynamic(e) (no root); D-1"}
  X_eval_points: {value: [2.5, 5.0, 9.0], range: [null, null], assumed: true, grounding: "setting", basis: "evaluation points of the growth weight X used by Papers 1 and 2 (the Bessemer screening range; the CAC-baseline and netted estimates; the middle tercile; notes/cross_paper_impacts.md, growth-weight bounds row); conclusions that flip below 2.5 are flagged, since the levels methods imply lower values. A firm range (tier0 growth_weight_low, growth_weight_high) replaces them with low, midpoint, high", section: "D-1; prop:playbook-rank, prop:acquired-score(a), cor:prod-dilution"}
  terminal_growth: {value: 0.02, range: [0.0, 0.04], assumed: true, rate: "continuous", section: "spec 9 (firm value)", note: "growth of savings after the planning horizon, for the terminal value", grounding: "b"}
  spend_ratio: {value: 3.3, range: [1.9, 7.4], assumed: false, grounding: "c", source: "Paper 1 empirics (sections/empirics.tex): median S&M share of revenue over excess growth, interquartile range 1.9 to 7.4; the all-S&M basis (a bound since 2 Nov 2026; finance.spend_ratio_netted is central)", section: "ass:playbook-calib, lem:playbook-calib (calibration of the position when no EV multiple or market growth is given)"}
  sm_maint_base: {value: 0.25056806425127603, range: [0.232622, 0.275722], assumed: false, grounding: "c", source: "Paper 1 maintenance base (round 2, author decision 4; macro MaintBase 25.1): median lagged S&M share of revenue of core firm-years growing at or below market, E1, 2023-25 audited v3 sample (notes/empirics_v3.json spend_maint_base, 90% firm-cluster bootstrap interval as range)", note: "with finance.sm_basis netted (central, author decision of 2 Nov 2026) growth spend is sigma = max(S&M share - base, 0) (+ rd_expansion_share x R&D) and min(S&M share, base) is a non-discretionary cost line; all S&M and no S&M are bounds (levers.sm_basis_bounds)", section: "Part I decisions 4 and 7 (S&M basis); spec 2.2"}
  sm_basis: {value: "netted", range: ["netted", "all", "none"], assumed: true, grounding: "setting", basis: "basis of growth spend: maintenance-netted, Paper 1's central basis (author decisions 4 and 7, 2 Nov 2026: the 2036 path, the lever ranking and the playbook); all (every S&M dollar buys growth, the convention before 2 Nov) and none (no S&M buys growth) are the bounds the lever map reports", section: "Part I decisions 4 and 7; spec 2.2 (impute.part1_baseline, levers.state)"}
  spend_ratio_netted: {value: 0.9875436841017979, range: [0.670456, 1.140252], assumed: false, grounding: "c", source: "Paper 1 empirics (notes/empirics_v3.json spend_maint_ratio, E1, 2023-25): median of (S&M share - maintenance base)/(g - G) over firm-years growing above market, 90% firm-cluster bootstrap interval as range; the netted counterpart of finance.spend_ratio", section: "ass:playbook-calib, lem:playbook-calib (calibration of the position on the netted basis when no EV multiple or market growth is given)"}
  terminal_multiple_cap: {value: 20.0, range: [12.0, 30.0], assumed: true, section: "spec 9 (firm value)", grounding: "d"}
  pass_through_phi: {value: 0.0, range: [0.0, 1.0], source: "Part I Cor priorities (iv): savings in cost of revenue at given prices unless competition passes them through", note: "an extra pass-through RATE (the ai_native_entrant scenario sets it), combined with the industry rate as phi = 1 - (1 - phi_ind)(1 - phi_extra) on unit-cost savings, margins at the post-cut price (Part I round 2, B1; formulas.passthrough_terms); in dollars it scales the durable share. The industry pass-through scenario dimension {0, 0.5, 0.7} enters through competition.phi_ind (named scenarios pass_through_*), not here: applying it to both would count pass-through twice", section: "spec 6", grounding: "d"}
  c_c_full_automation: {value: {"2025": 0.06, "2028": 0.12, "2031": 0.08, "2036": 0.05}, range: [0.01, 0.30], assumed: false, grounding: "d", source: "data/tasks/params.yaml part1_ceiling.c_c_compute_share: 0.06 [0.01, 0.20] at 2025 prices (b-anchored: METR run costs, Stevens 2026, AI-native products); by horizon 2028 0.12 [0.02, 0.30], 2031 0.08 [0.01, 0.25], 2036 0.05 [0.01, 0.20] (d: explicit path c_c(H) = s_L [omega_H kappa_front + (1 - omega_H) kappa_fixed(H)], Gundlach et al. 2026 price decline, value-test cap); assumptions round 2 Section 2, read 29 Oct 2026; tests/test_regression.py keeps this map equal to params.yaml", note: "Part I's compute share at full automation, by calendar year (linear between knots, flat outside). The range [0.01, 0.30] is the envelope of the scenario-path ranges by horizon in params.yaml, used for the tornado; it is not Paper 1's credible range for the 2025-price share, which since round 2 runs from 1% to the value-test cap of 60% (s_L); used only for the full-automation ceiling report (security.ceiling_terms), not for the plan's own compute costs, which are built bottom-up from prices.*", section: "Part I Cor ceiling; spec 22 (params commit 29 Oct 2026)"}

