  C_val: {value: 24000.0, range: [12000.0, 48000.0], assumed: false, grounding: "b", basis: "ICFR retest of the controls an in-scope AI application performs at each forced model upgrade (rate 1/security.T_up), priced at KPMG test effort: 10 controls per application (class d; assumptions round 2 Section 5.5) x 16 hours per control test (KPMG 2025 SOX Survey, n = 146, FY2024; class b) x $150 an hour (the itgc_setup basis; class d) = $24,000 (Paper 2 theory pass, notes/p2_theory_fixes_v2.md Section 2; P2 check 6c1); range halves and doubles the control count", note: "FT-20 resolved by definition (ass:acct-itgc): a forced upgrade appears in three non-overlapping lines, the functional regression suite in the run costs (security.reval_share of the build at each upgrade), the change ticket in itgc_c_chg x itgc_n_chg, and the re-testing of the application's controls here; was $100,000 (about 42 control tests, which the survey does not support)", section: "spec 24.4, 25 (C_val); eq:acct-itgc"}
  N_o: {value: 24.0, range: [12.0, 48.0], assumed: true, grounding: "d", basis: "opportunities a year for a material misstatement in one in-scope control objective (Paper 1 rem:amin-values and Paper 2 prop:acct-amin example: 24; 48 needs two human layers); the engine treats the financial reporting its plan automates as one objective", section: "def:acct-admissible, prop:acct-amin (N_o); Part I prop:amin"}
  eps_bar: {value: 0.05, range: [0.01, 0.05], assumed: true, grounding: "policy", basis: "the firm's operational reading of 'remote' (no reasonable possibility of a material misstatement not prevented or detected on a timely basis, AS 2201.A7 and Regulation S-K Item 308(a)(3), with FAS 5's 'remote': the chance is slight); no auditing or SEC standard sets a number (notes/p2_theory_fixes_v2.md Section 1). A scenario value with no central value (Paper 1 round 2, C1: class d): every floor is reported at 1 percent and at 5 percent side by side (accountability_floor by_eps_bar), and this key only sets which of the two the single-number ceiling (ceiling_terms a_min_used) uses; it is not drawn in the Monte Carlo because admissibility is pass/fail. The engine pass of 29 Oct 2026 had called 5 percent central; that label is withdrawn", note: "evidence that bears on the 5 percent value, not a grounding of a central value: most audited filers, whose controls are mostly human-run, obtain effective opinions. Audit Analytics, SOX 404 Disclosures: A Seventeen-Year Review (2 Nov 2021, blog.auditanalytics.com): 4.6 percent of SOX 404(b) auditor attestations were adverse for fiscal 2020. Audit Analytics, SOX 404 Disclosures: An Eighteen-Year Review (July 2022, blog.auditanalytics.com; the latest edition that could be read at the source on 29 Oct 2026): 5.8 percent for fiscal 2021 and 4.8 percent for fiscal 2019. A later edition (Ideagen, 2026) is behind a download form and was not read. At 1 percent the reference human-only design fails in the Paper 1 and Paper 2 examples. Per objective, 5 percent at firm level over about 10 objectives is about 0.5 percent each (Paper 1 round 2, C1)", section: "def:acct-admissible (eps_bar); Part I prop:amin(b) (pi-bar)"}
  p_cc: {value: 0.0, range: [0.0, 0.002], assumed: true, grounding: "d", basis: "cause shared by every control layer (management override, defective shared data or information produced by the entity, failure of the ITGCs every layer relies on, reviewers accepting wrong AI output): Part I ass:layers p^cc; the Paper 1 and Paper 2 examples set none", section: "prop:acct-amin(a) (p^cm_0), Part I prop:amin(a) (p^cc)"}
  N_nm: {value: 2000.0, range: [200.0, 20000.0], assumed: true, grounding: "d", basis: "errors below materiality a year per $1B of revenue (Part I prop:amin(c): only errors below materiality enter the floor as an expected cost); was accounting.N_mm", section: "spec 24.4; Part I prop:amin(c) (N^nm)"}
  L_nm: {value: 20000.0, range: [5000.0, 100000.0], assumed: true, grounding: "d", basis: "loss per undetected error below materiality (rework, adjustment); was accounting.L_mm", section: "spec 24.4; Part I prop:amin(c) (L^nm)"}
  L_mm: {value: 10000000.0, range: [2000000.0, 50000000.0], assumed: true, grounding: "d", basis: "consequence cost of an undetected material misstatement (restatement, remediation, audit, cost of capital, litigation, clawback): Paper 2 prop:acct-amin example $10 million; reported as the residual expected consequence N_o L_mm P of the chosen design, never traded against cost inside a_min (prop:acct-amin(d))", section: "prop:acct-amin(d) (L_mm, reported only)"}
  control_types: {value: {human: {p: 0.05, p_cm: 0.002, c: 500000.0, kind: human}, ai: {p: 0.02, p_cm: 0.005, c: 50000.0, ai: true, kind: ai}}, range: [null, null], assumed: true, grounding: "d", basis: "illustrative layered-control parameters of the Paper 1 and Paper 2 examples (rem:amin-values; prop:acct-amin example): per layer a year, miss probability p, common-mode probability p_cm and cost c; human 0.05, 0.002 (Paper 1 notes it is high for an effective control environment), $500,000; AI 0.02, 0.005 with effective ITGCs, $50,000. At N_o = 24 the cheapest admissible design is one human over one AI layer at eps_bar 5 percent and one over two at 1 percent; no all-AI design on one provider is admissible (floor 11.3 percent a year). The designs are conditional on these illustrative values: one over one stays admissible at 5 percent only up to a cross-type common mode p_cc of about 0.0008 per opportunity and a human miss rate on AI-missed items of about 8.4 percent (Paper 1 round 2, C2; the engine reports both break-evens with every design). Replaces the engine's earlier three-type set (human, automated, ai), which had no source; a firm can set its own types", section: "spec 24.4; prop:acct-amin; Part I ass:layers"}
  audit_fee: {value: 1492375.0, range: [343000.0, 5327646.0], assumed: false, grounding: "a", source: "Ideagen Audit Analytics, Audit Fee Trends 2003-2022 (July 2023), p. 14: 'In FY2022, average audit fees paid by accelerated filers increased 31% from FY2021 to $1,492,375' (read in the PDF by the lead agent, 2 Nov 2026; bib key auditanalytics2023fees; params.yaml security_and_maintenance.compliance.audit_fee_accelerated_filer_reference). The size-matched fee for a firm of about $1 billion of revenue; a lower bound if the firm is a large accelerated filer", note: "central fee of C_acct since Paper 1 round 2 (C3, lead-agent ruling of 2 Nov 2026); range: the S&P 500 ratio at $1 billion of revenue (low; accounting.audit_fee_per_musd) to the large-accelerated-filer average (high; accounting.audit_fee_high)", section: "spec 24.4 (C_acct); Part I prop:amin"}
  audit_fee_high: {value: 5327646.0, range: [null, null], assumed: false, grounding: "a", source: "Ideagen Audit Analytics, Audit Fee Trends 2003-2022 (July 2023), p. 14: FY2022 average audit fee of large accelerated filers, $5,327,646 (read by the lead agent, 2 Nov 2026)", section: "spec 24.4 (C_acct, high case)"}
