success:
  a0: {value: 2.12, range: [1.19, 3.51], assumed: false, grounding: "b", flag: "survey", source: "calibrated (engine pass of 29 Oct 2026, coordinator decision; assumptions round 2 Section 1.1, last paragraph) so that a reference five-step process (readiness 0.6, exposure 0.6, 50 affected FTE, average team and sponsor, log capability margin 0) creates some value with probability varpi = 0.70 [0.54, 0.80], Paper 1's value (varpi is the share of attempts that create some value, not a success rate; Paper 1 round 2, B9; the calibration target is the per-attempt yield varpi x b_bar = 0.47) (params.yaml project_outcomes.transformation_attempt_creates_value_varpi: BCG 2020, 74 percent of 825 transformations created value, rounded down for self-report; low end S&P Global pilot attrition 0.54; high end BCG's six-factor rate 0.80). With success.b_bar 0.67 (McKinsey's realized share for successful transformations) the per-attempt expected realization is 0.70 x 0.67 = 0.47 [0.20, 0.68], Paper 1's product and McKinsey's unconditional 0.46. The rule's first branch (production probability 0.50, the params commit's 1.87) gave 0.50 x 0.67 = 0.34, below the rule's own target. The reference's failure hazard is split equally between the process factor and the five activity factors (each sqrt(0.70) = 0.837; the split is not measured, class d; the previous split put two thirds on the process factor, which capped the reference at 0.63); the range maps the reference to 0.54 and 0.80 with success.c0 at its default", section: "spec 14.1; Lemma lem:tasks-success"}
  a_iota: {value: 2.0, range: [1.0, 3.0], assumed: true, section: "spec 14.1 (readiness)", grounding: "d"}
  a_H: {value: 0.5, range: [0.2, 1.0], assumed: true, section: "spec 14.1 (log capability margin)", grounding: "d"}
  a_R: {value: 0.5, range: [0.0, 1.0], assumed: true, section: "spec 14.1 (regulated step)", grounding: "d"}
  c0: {value: 2.31, range: [1.11, 3.11], assumed: true, basis: "process-factor intercept: expit(c0 - c_exc 0.4 - c_fte ln 2) = sqrt(0.70) = 0.837 for the reference five-step process (readiness 0.6, exposure 0.6, 50 affected FTE, average team and sponsor), its equal share of the reference's failure hazard; with success.a0 the reference creates some value with probability 0.70 (the share of attempts that create some value, not a success rate; engine pass of 29 Oct 2026; was 1.2, a process factor of 0.63 that capped the reference below 0.70); range keeps the previous offsets (-1.2, +0.8): reference 0.51 to 0.77 with a0 at its default", section: "spec 14.1 (process factor intercept)", grounding: "d"}
  c_exc: {value: 1.0, range: [0.0, 2.0], assumed: true, section: "spec 14.1 (exception share, proxied by 1 - LLM exposure)", grounding: "d"}
