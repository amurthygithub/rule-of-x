  b_bar: {value: 0.67, range: [0.37, 0.85], params: "project_outcomes.transformation_value_realized_share_b_bar", assumed: false, grounding: "a", flag: "survey (self-reported)", basis: "McKinsey Global Survey (7 Dec 2021, n = 1,034): successful transformations realize 67 percent of the maximum financial benefits, all others 37 percent; read 29 Oct 2026 (assumptions round 2 Section 1.4); replaces the unsourced 0.85", section: "spec 14.1 (benefit realization given success)"}
